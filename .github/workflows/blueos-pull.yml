name: 'BlueOS Subtree Pull'

on:
  workflow_call:
    inputs:
      github-app-client-id:
        description: 'Client ID of the GitHub App that creates the sync PR.'
        required: true
        type: string
      pr-author:
        description: 'Username of a GitHub account that will create the sync PR. Must include [bot] at the end.'
        required: true
        type: string
      josh-sync-repository:
        description: 'GitHub owner/repository from which to install vivoblueos-josh-sync.'
        required: true
        type: string
      josh-sync-revision:
        description: 'Immutable commit SHA of vivoblueos-josh-sync to install.'
        required: true
        type: string
      branch-name:
        description: 'Name of the branch to create for the sync'
        required: false
        default: blueos-pull
        type: string
      pr-base-branch:
        description: 'Base branch for the pull request'
        required: false
        default: main
        type: string
      pr-label:
        description: 'Label applied to synchronization pull requests'
        required: false
        default: josh-sync
        type: string
      environment:
        description: 'GitHub Actions environment that will be used to access secrets'
        required: false
        type: string
    secrets:
      github-app-secret:
        description: 'Secret for a GitHub app that will create the sync PR'
        required: true
      approval-user-token:
        description: 'Fine-grained user token used only to approve sync PRs.'
        required: true

jobs:
  perform-pull:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      pr_url: ${{ steps.update-pr.outputs.pr_url }}
      pull_result: ${{ steps.josh-sync.outputs.pull_result }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-secret }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          # Keep the App credential in origin so a bot push triggers PR CI.
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out workflow scripts
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.josh-sync-repository }}
          ref: ${{ inputs.josh-sync-revision }}
          path: .github/josh-sync-scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Install stable Rust toolchain
        run: rustup update stable

      - name: Restore Josh tool cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/vivoblueos-josh-sync
            ~/.cargo/bin/josh-proxy
            ~/.cargo/bin/josh-filter
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/git
            ~/.cargo/registry
            /home/runner/.cache/vivoblueos-josh
          key: blueos-josh-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.josh-sync-revision }}-pull
          restore-keys: |
            blueos-josh-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.josh-sync-revision }}-
            blueos-josh-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup bot git name and email
        run: |
          git config --global user.name 'The vivoblueos-josh-sync Cronjob Bot'
          git config --global user.email 'github-actions@github.com'

      - name: Install vivoblueos-josh-sync
        run: |
          cargo +stable install --locked \
            --git "https://github.com/${{ inputs.josh-sync-repository }}" \
            --rev "${{ inputs.josh-sync-revision }}"

      - name: Perform BlueOS sync
        id: josh-sync
        shell: bash {0}
        run: |
          vivoblueos-josh-sync pull
          exitcode=$?

          if [ $exitcode -eq 0 ]; then
            echo "pull_result=pull-finished" >> $GITHUB_OUTPUT
          elif [ $exitcode -eq 2 ]; then
            echo "pull_result=skipped" >> $GITHUB_OUTPUT
            exitcode=0
          else
            echo "pull_result=failed" >> $GITHUB_OUTPUT
          fi

          exit ${exitcode}

      - name: Push changes to a branch
        if: ${{ steps.josh-sync.outputs.pull_result == 'pull-finished' }}
        run: |
          BRANCH="${{ inputs.branch-name }}"
          git switch -c $BRANCH
          git push -u origin $BRANCH --force

      - name: Create pull request
        id: update-pr
        if: ${{ steps.josh-sync.outputs.pull_result == 'pull-finished' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SYNC_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APPROVAL_GITHUB_TOKEN: ${{ secrets.approval-user-token }}
          JOSH_SYNC_AUTO_MERGE: ${{ vars.JOSH_SYNC_AUTO_MERGE || 'false' }}
          PR_AUTHOR: ${{ inputs.pr-author }}
          PR_HEAD_BRANCH: ${{ inputs.branch-name }}
          PR_BASE_BRANCH: ${{ inputs.pr-base-branch }}
          PR_LABEL: ${{ inputs.pr-label }}
        run: bash "$GITHUB_WORKSPACE/.github/josh-sync-scripts/scripts/blueos-pull-create-pr.sh"
