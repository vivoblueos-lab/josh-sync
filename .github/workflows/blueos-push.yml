name: 'BlueOS Subtree Push'
on:
  workflow_call:
    inputs:
      github-app-client-id:
        description: 'Client ID of the GitHub App that pushes and creates the monorepo PR.'
        required: true
        type: string
      josh-sync-repository:
        description: 'GitHub owner/repository from which to install vivoblueos-josh-sync.'
        required: true
        type: string
      josh-sync-revision:
        description: 'Immutable commit SHA of vivoblueos-josh-sync to install.'
        required: true
        type: string
      branch-name:
        description: 'CI-owned branch in the configured monorepo. Defaults to a name derived from the caller repository.'
        required: false
        default: ''
        type: string
      pr-label:
        description: 'Label applied to synchronization pull requests.'
        required: false
        default: josh-sync
        type: string
      environment:
        description: 'GitHub Actions environment used to access secrets.'
        required: false
        type: string
    outputs:
      pr_url:
        description: 'Created or updated monorepo pull request URL.'
        value: ${{ jobs.perform-push.outputs.pr_url }}
      push_result:
        description: 'Either push-finished or skipped.'
        value: ${{ jobs.perform-push.outputs.push_result }}
    secrets:
      github-app-secret:
        description: 'Private key of the GitHub App.'
        required: true
jobs:
  perform-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      pr_url: ${{ steps.update-pr.outputs.pr_url }}
      push_result: ${{ steps.josh-sync.outputs.push_result }}
    permissions:
      contents: read
    steps:
      - name: Check out subrepo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install stable Rust toolchain
        run: rustup update stable
      - name: Restore Josh tool cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/vivoblueos-josh-sync
            ~/.cargo/bin/josh-proxy
            ~/.cargo/bin/josh-filter
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/git
            ~/.cargo/registry
            /home/runner/.cache/vivoblueos-josh
          key: blueos-josh-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.josh-sync-revision }}-push
          restore-keys: |
            blueos-josh-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.josh-sync-revision }}-
            blueos-josh-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install vivoblueos-josh-sync
        run: |
          cargo +stable install --locked \
            --git "https://github.com/${{ inputs.josh-sync-repository }}" \
            --rev "${{ inputs.josh-sync-revision }}"

      - name: Check out workflow scripts
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.josh-sync-repository }}
          ref: ${{ inputs.josh-sync-revision }}
          path: .github/josh-sync-scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Read synchronization config
        id: config
        env:
          JOSH_SYNC_REPOSITORY: ${{ inputs.josh-sync-repository }}
          JOSH_SYNC_REVISION: ${{ inputs.josh-sync-revision }}
          REQUESTED_BRANCH: ${{ inputs.branch-name }}
        run: python3 "$GITHUB_WORKSPACE/.github/josh-sync-scripts/scripts/blueos-push-read-config.py"
      - name: Create monorepo GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.github-app-client-id }}
          private-key: ${{ secrets.github-app-secret }}
          owner: ${{ steps.config.outputs.upstream-owner }}
          repositories: ${{ steps.config.outputs.upstream-repository }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure Git credentials
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash "$GITHUB_WORKSPACE/.github/josh-sync-scripts/scripts/blueos-push-configure-credentials.sh"
      - name: Set bot Git identity
        run: |
          git config --global user.name 'The vivoblueos-josh-sync Cronjob Bot'
          git config --global user.email 'github-actions@github.com'
      - name: Push subtree update
        id: josh-sync
        shell: bash {0}
        env:
          BRANCH: ${{ steps.config.outputs.branch }}
          GIT_TERMINAL_PROMPT: 0
          UPSTREAM_OWNER: ${{ steps.config.outputs.upstream-owner }}
        run: |
          vivoblueos-josh-sync push \
            "$BRANCH" \
            "$UPSTREAM_OWNER" \
            --update-existing \
            --no-interact
          exitcode=$?

          if [ "$exitcode" -eq 0 ]; then
            echo 'push_result=push-finished' >> "$GITHUB_OUTPUT"
          elif [ "$exitcode" -eq 2 ]; then
            echo 'push_result=skipped' >> "$GITHUB_OUTPUT"
            exitcode=0
          else
            echo 'push_result=failed' >> "$GITHUB_OUTPUT"
          fi

          exit "$exitcode"
      - name: Create or update monorepo pull request
        id: update-pr
        if: ${{ steps.josh-sync.outputs.push_result == 'push-finished' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.config.outputs.branch }}
          JOSH_SYNC_AUTO_MERGE: ${{ vars.JOSH_SYNC_AUTO_MERGE || 'false' }}
          PR_LABEL: ${{ inputs.pr-label }}
          SUBREPO: ${{ steps.config.outputs.subrepo }}
          UPSTREAM: ${{ steps.config.outputs.upstream }}
          UPSTREAM_BRANCH: ${{ steps.config.outputs.upstream-branch }}
          UPSTREAM_OWNER: ${{ steps.config.outputs.upstream-owner }}
        run: bash "$GITHUB_WORKSPACE/.github/josh-sync-scripts/scripts/blueos-push-update-pr.sh"
      - name: Remove temporary credentials
        if: ${{ always() }}
        run: |
          git config --global --unset-all credential.helper || true
          rm -f "$RUNNER_TEMP/josh-sync-credentials"
