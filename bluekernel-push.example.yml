name: Push kernel changes to BlueKernel
on:
  push:
    # 哪个分支更新时推送同步, libc 的 blueos-dev 比较特殊
    branches: [main]
  # 允许网页触发
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bluekernel-push-${{ github.repository }}
  cancel-in-progress: false
jobs:
  push:
    if: ${{ vars.JOSH_SYNC_ENABLED == 'true' }}
    uses: vivoblueos-lab/josh-sync/.github/workflows/bluekernel-push.yml@<josh-sync-commit>
    with:
      github-app-client-id: ${{ vars.JOSH_SYNC_APP_CLIENT_ID }}
      pr-author: "blueos-josh-sync[bot]"
      josh-sync-repository: vivoblueos-lab/josh-sync
      josh-sync-revision: <josh-sync-commit>
    secrets:
      github-app-secret: ${{ secrets.JOSH_SYNC_APP_PRIVATE_KEY }}
      approval-user-token: ${{ secrets.JOSH_SYNC_APPROVAL_USER_TOKEN }}
