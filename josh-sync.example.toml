# GitHub org of the repository (optional, `vivoblueos` is the default)
#org = "vivoblueos"
# Name of the repository
repo = "kernel"
# GitHub owner/name of the BlueKernel monorepo. Keep this tracked in every subtree so a trial and
# production deployment have an explicit, reviewable source.
upstream-repo = "<github-owner>/<bluekernel-monorepo>"
# Branch to synchronize in the configured monorepo.
upstream-branch = "main"
# Path where the subtree is located in the configured BlueKernel monorepo.
path = "kernel"

# Optionally, you can specify the complete Josh filter for complex cases
# Note that this option is mutually exclusive with `path`
#filter = ...

# Optionally, you can specify the filter version, which tells josh-sync which postprocessing to
# apply to the specified filter.
# If not specified, it defaults to version 1.
# Version 1 - default "legacy" behavior of Josh, which preserves empty merge commits
# Version 2 - newer behavior that skips empty merge commits
filter-version = 2

# Optionally, you can specify a subtree filter.
# This will be applied to the local `HEAD` during the round-trip check.
#
# By default, the round-trip check expects the local repo to be a perfect 1:1 mirror
# of the upstream tree. Leave this empty if that is your intent.
#
# If you are not doing a 1:1 mirror, set this to a filter that transforms your local
# `HEAD` into a tree that exactly matches the upstream tree after the `filter`
# is applied.
# E.g., if the `filter` is ":/compiler/bluekernel_component:prefix=bluekernel_component",
# the `subtree-filter` should be:
#subtree-filter = ":/bluekernel_component:prefix=bluekernel_component"

# Optionally, you can specify a set of commands executed after a successful pull.
# If the executed command changes the local git state (performs some modifications to files that
# were already tracked), then a new commit with the given message will be created.
#[[post-pull]]
#cmd = ["cargo", "fmt"]
#commit-message = "reformat"
